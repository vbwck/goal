<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.goal {
    width: 900px;
    height: 105px;
    padding: 22px 30px;

    border-radius: 22px;
    background:
        radial-gradient(circle at 20% 50%, rgba(125, 60, 255, 0.28), transparent 35%),
        radial-gradient(circle at 80% 50%, rgba(255, 190, 0, 0.10), transparent 35%),
        linear-gradient(110deg, #10091d, #21103b, #10091d);

    background-size: 200% 200%;
    animation: bgMove 7s ease-in-out infinite;

    box-shadow:
        0 0 25px rgba(120, 50, 255, 0.25),
        inset 0 0 20px rgba(255,255,255,0.03);

    overflow: hidden;
}

.info {
    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 22px;
    font-weight: 700;
    white-space: nowrap;
}

.start {
    color: #b875ff;
}

.mic {
    color: #ffd429;
    text-shadow: 0 0 10px rgba(255, 212, 41, 0.55);
}

.percent {
    color: #ffffff;
    text-shadow: 0 0 12px rgba(190, 120, 255, 0.9);
}

.target {
    color: #ffffff;
}

/* Полоска */
.progress {
    margin-top: 14px;
    width: 100%;
    height: 22px;

    background: rgba(255,255,255,0.10);
    border-radius: 20px;
    overflow: hidden;

    box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
}

.fill {
    position: relative;
    width: 5.56%;
    height: 100%;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #7b2cff,
        #c06cff,
        #7b2cff
    );

    background-size: 200% 100%;
    animation: shine 2.5s linear infinite;

    box-shadow:
        0 0 12px rgba(150, 70, 255, 0.8);
}

.fill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -80px;
    width: 60px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.65),
        transparent
    );

    animation: sweep 2.5s infinite;
}

@keyframes bgMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

@keyframes sweep {
    0%   { left: -80px; }
    100% { left: 110%; }
}
</style>
</head>

<body>

<div class="goal">

    <div class="info">
        <div class="start">150 грн</div>

        <div class="mic">🎤 НА НОВЫЙ МАКАФОН</div>

        <div class="percent">5.6%</div>

        <div class="target">2700 грн</div>
    </div>

    <div class="progress">
        <div class="fill"></div>
    </div>

</div>

</body>
</html>

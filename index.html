
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.donation {
    width: 560px;
    padding: 14px 18px 15px;

    background: linear-gradient(
        135deg,
        rgba(12, 12, 20, 0.96),
        rgba(20, 14, 32, 0.94)
    );

    border: 1px solid rgba(168, 85, 247, 0.45);
    border-radius: 12px;

    box-shadow:
        0 0 25px rgba(124, 58, 237, 0.15),
        inset 0 0 25px rgba(168, 85, 247, 0.035);

    color: #fff;

    animation: enter 0.6s ease-out;
}

/* Верхняя строка */

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1.8px;
}

.brand-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #a855f7;

    box-shadow:
        0 0 8px #a855f7,
        0 0 16px rgba(168, 85, 247, 0.7);

    animation: dotPulse 2s ease-in-out infinite;
}

.brand span {
    color: #a855f7;
}

.goal-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.3px;
    color: #aaa;

    text-transform: uppercase;
}

/* Сумма */

.amount-row {
    display: flex;
    align-items: baseline;
    gap: 6px;

    margin-bottom: 9px;
}

.current {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.separator {
    color: #555;
    font-size: 17px;
}

.target {
    font-size: 14px;
    color: #999;
    font-weight: 600;
}

/* Полоса */

.progress-wrap {
    position: relative;
    width: 100%;
}

.progress {
    width: 100%;
    height: 8px;

    background: rgba(255,255,255,0.075);
    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.8);
}

.fill {
    width: 5.56%;
    height: 100%;

    position: relative;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #6d28d9,
        #8b5cf6,
        #c084fc,
        #6366f1
    );

    background-size: 250% 100%;

    box-shadow:
        0 0 8px rgba(168,85,247,0.9),
        0 0 18px rgba(124,58,237,0.45);

    animation: gradient 3s linear infinite;
}

/* Бегущий блик */

.fill::after {
    content: "";

    position: absolute;
    top: 0;
    left: -70px;

    width: 65px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.95),
        transparent
    );

    animation: shine 2.8s ease-in-out infinite;
}

/* Нижняя строка */

.bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 8px;
}

.support {
    font-size: 10px;
    color: #777;
    letter-spacing: 0.8px;
}

.percent {
    font-size: 12px;
    font-weight: 800;
    color: #c084fc;
}

/* Анимации */

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 250% 50%;
    }
}

@keyframes shine {
    0% {
        left: -70px;
    }

    65%,
    100% {
        left: 110%;
    }
}

@keyframes dotPulse {
    0%,
    100% {
        opacity: 0.7;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.25);
    }
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    .donation,
    .fill,
    .fill::after,
    .brand-dot {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="donation">

    <div class="top">

        <div class="brand">
            <div class="brand-dot"></div>
            BULKA<span>GAMING</span>
        </div>

        <div class="goal-title">
            🎤 МАКАФОН
        </div>

    </div>


    <div class="amount-row">

        <div class="current">
            150 грн
        </div>

        <div class="separator">
            /
        </div>

        <div class="target">
            2700 грн
        </div>

    </div>


    <div class="progress-wrap">

        <div class="progress">
            <div class="fill"></div>
        </div>

    </div>


    <div class="bottom">

        <div class="support">
            ПОДДЕРЖКА СТРИМА
        </div>

        <div class="percent">
            5.6%
        </div>

    </div>

</div>

</body>
</html>

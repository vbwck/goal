
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.goal {
    width: 520px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    gap: 14px;

    background: rgba(8, 8, 14, 0.94);
    border: 1px solid rgba(168, 85, 247, 0.55);
    border-radius: 10px;

    color: white;

    box-shadow:
        0 0 15px rgba(124, 58, 237, 0.20),
        inset 0 0 18px rgba(168, 85, 247, 0.04);

    animation: entrance 0.6s ease-out;
}

/* LOGO */
.logo {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #ffffff;
    white-space: nowrap;
}

.logo span {
    color: #a855f7;
}

/* MAIN TEXT */
.info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    white-space: nowrap;
}

.label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #a855f7;
    text-transform: uppercase;
}

.amount {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
}

/* PROGRESS */
.bar {
    flex: 1;
    min-width: 120px;
    height: 9px;

    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.7);
}

.fill {
    width: 5.56%;
    height: 100%;

    position: relative;
    overflow: hidden;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #7c3aed,
        #a855f7,
        #6366f1,
        #a855f7
    );

    background-size: 250% 100%;

    box-shadow:
        0 0 8px rgba(168,85,247,0.8);

    animation:
        gradient 2.5s linear infinite,
        glow 2s ease-in-out infinite;
}

/* Блик */
.fill::after {
    content: "";
    position: absolute;

    top: 0;
    left: -60px;

    width: 55px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.9),
        transparent
    );

    animation: shine 2.2s ease-in-out infinite;
}

/* PERCENT */
.percent {
    min-width: 38px;

    font-size: 13px;
    font-weight: 800;
    text-align: right;

    color: #c084fc;
}

/* ANIMATIONS */

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 250% 50%;
    }
}

@keyframes shine {
    0% {
        left: -60px;
    }

    65%, 100% {
        left: 110%;
    }
}

@keyframes glow {
    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.25);
    }
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    .goal,
    .fill,
    .fill::after {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="goal">

    <div class="logo">
        BULKA<span>GAMING</span>
    </div>

    <div class="info">
        <div class="label">🎤На норм МАКАФОН 🎤</div>
        <div class="amount">150 / 2700 грн</div>
    </div>

    <div class="bar">
        <div class="fill"></div>
    </div>

    <div class="percent">5.6%</div>

</div>

</body>
</html>
```

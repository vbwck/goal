```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.goal {
    position: relative;
    width: 1010px;
    padding: 9px;

    background:
        linear-gradient(
            110deg,
            rgba(18, 12, 35, 0.94),
            rgba(42, 20, 65, 0.92),
            rgba(15, 18, 42, 0.94),
            rgba(48, 22, 72, 0.92)
        );

    background-size: 300% 300%;

    border: 1px solid rgba(192, 132, 252, 0.55);
    border-radius: 14px;

    box-shadow:
        0 0 25px rgba(168, 85, 247, 0.25),
        inset 0 0 22px rgba(192, 132, 252, 0.08);

    animation:
        backgroundMove 8s ease infinite,
        blockPulse 4s ease-in-out infinite,
        appear 0.6s ease-out;
}

/* Мягкое движущееся свечение фона */

.goal::before {
    content: "";

    position: absolute;
    width: 420px;
    height: 180px;

    left: -100px;
    top: -80px;

    background: radial-gradient(
        ellipse,
        rgba(192, 132, 252, 0.20),
        rgba(139, 92, 246, 0.08),
        transparent 70%
    );

    filter: blur(25px);

    animation: glowMove 6s ease-in-out infinite alternate;

    pointer-events: none;
}

.goal::after {
    content: "";

    position: absolute;
    width: 350px;
    height: 160px;

    right: -100px;
    bottom: -80px;

    background: radial-gradient(
        ellipse,
        rgba(99, 102, 241, 0.18),
        transparent 70%
    );

    filter: blur(25px);

    animation: glowMove2 7s ease-in-out infinite alternate;

    pointer-events: none;
}

/* Верх */

.header {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 5px 8px;
}

.brand {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.6px;
    color: #fff;

    text-shadow: 0 0 8px rgba(255,255,255,0.25);
}

.brand span {
    color: #c084fc;
}

.title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #880;

    text-shadow:
        0 0 8px rgba(192,132,252,0.45);
}

/* BAR */

.bar {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 54px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.12),
            rgba(255,255,255,0.055)
        );

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        inset 0 1px 5px rgba(0,0,0,0.65),
        0 0 10px rgba(168,85,247,0.08);
}

/* Заполнение */

.fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5.9%;

    border-radius: 9px;

    background:
        linear-gradient(
            100deg,
            #6d28d9,
            #8b5cf6,
            #c084fc,
            #6366f1,
            #a855f7
        );

    background-size: 300% 100%;

    box-shadow:
        0 0 14px rgba(168,85,247,0.85),
        5px 0 20px rgba(124,58,237,0.45);

    animation: gradient 3s linear infinite;
}

/* Блик */

.fill::after {
    content: "";

    position: absolute;
    top: 0;
    left: -90px;

    width: 90px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );

    animation: shine 2.5s ease-in-out infinite;
}

/* Текст */

.content {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;

    pointer-events: none;

    text-shadow:
        0 2px 6px rgba(0,0,0,0.95),
        0 0 12px rgba(0,0,0,0.9);
}

.amount {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 0.3px;

    color: #fff;
}

.current {
    color: #ffffff;
}

.slash {
    margin: 0 8px;
    color: rgba(255,255,255,0.55);
}

.target {
    color: rgba(255,255,255,0.9);
}

/* Нижняя строка */

.footer {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 7px 5px 0;
}

.support {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.65);
}

.percent {
    font-size: 13px;
    font-weight: 900;
    color: #d8b4fe;

    text-shadow:
        0 0 8px rgba(192,132,252,0.55);
}

/* Анимации */

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}

@keyframes shine {
    0% {
        left: -90px;
    }

    65%,
    100% {
        left: 120%;
    }
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes glowMove {
    from {
        transform: translateX(0) translateY(0);
        opacity: 0.65;
    }

    to {
        transform: translateX(650px) translateY(70px);
        opacity: 1;
    }
}

@keyframes glowMove2 {
    from {
        transform: translateX(0) translateY(0);
        opacity: 0.5;
    }

    to {
        transform: translateX(-500px) translateY(-50px);
        opacity: 0.9;
    }
}

@keyframes blockPulse {
    0%,
    100% {
        box-shadow:
            0 0 25px rgba(168,85,247,0.22),
            inset 0 0 22px rgba(192,132,252,0.07);
    }

    50% {
        box-shadow:
            0 0 34px rgba(168,85,247,0.34),
            inset 0 0 25px rgba(192,132,252,0.11);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    .goal,
    .fill,
    .fill::after,
    .goal::before,
    .goal::after {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="goal">

    <div class="header">

        <div class="brand">
            BULKA<span>GAMING</span>
        </div>

        <div class="title">
            🎤НА НОВЫЙ МАКАФОН 🎤
        </div>

    </div>

    <div class="bar">

        <div class="fill"></div>

        <div class="content">

            <div class="amount">
                <span class="current">150 грн</span>
                <span class="slash">/</span>
                <span class="target">2700 грн</span>
            </div>

        </div>

    </div>

    <div class="footer">

        <div class="support">
            ПОДДЕРЖКА СТРИМА
        </div>

        <div class="percent">
            5.9%
        </div>

    </div>

</div>

</body>
</html>
```

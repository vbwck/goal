```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.goal {
    position: relative;
    width: 1010px;
    padding: 14px 18px 13px;

    background:
        linear-gradient(
            110deg,
            rgba(20, 12, 38, 0.96),
            rgba(48, 20, 72, 0.94),
            rgba(17, 20, 48, 0.96),
            rgba(48, 20, 72, 0.94)
        );

    background-size: 300% 300%;

    border: 1px solid rgba(192, 132, 252, 0.5);
    border-radius: 14px;

    box-shadow:
        0 0 28px rgba(168, 85, 247, 0.25),
        inset 0 0 25px rgba(192, 132, 252, 0.07);

    animation: backgroundMove 9s ease infinite;
}

/* мягкое движение света на фоне */

.goal::before {
    content: "";
    position: absolute;

    width: 500px;
    height: 180px;

    left: -120px;
    top: -90px;

    background: radial-gradient(
        ellipse,
        rgba(192,132,252,0.20),
        transparent 70%
    );

    filter: blur(25px);

    animation: lightMove 7s ease-in-out infinite alternate;

    pointer-events: none;
}

/* Верхняя строка */

.info {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 11px;
}

.money {
    font-size: 24px;
    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 10px rgba(255,255,255,0.25);
}

.current {
    color: #c084fc;
}

.target {
    color: #ffffff;
}

.label {
    font-size: 17px;
    font-weight: 900;

    letter-spacing: 1.5px;

    color: #ffffff;

    text-transform: uppercase;

    text-shadow:
        0 0 12px rgba(192,132,252,0.55);
}

.percent {
    font-size: 23px;
    font-weight: 900;

    color: #d8b4fe;

    text-shadow:
        0 0 12px rgba(192,132,252,0.75);
}

/* Полоса */

.bar {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 25px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.12),
            rgba(255,255,255,0.045)
        );

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        inset 0 1px 5px rgba(0,0,0,0.7);
}

/* 150 / 2700 = 5.56% */

.fill {
    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 5.56%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #a855f7,
            #d8b4fe,
            #8b5cf6
        );

    background-size: 300% 100%;

    box-shadow:
        0 0 15px rgba(168,85,247,0.9),
        5px 0 20px rgba(124,58,237,0.55);

    animation: gradient 3s linear infinite;
}

/* Блик */

.fill::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100px;

    width: 90px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.85),
        transparent
    );

    animation: shine 2.7s ease-in-out infinite;
}

/* Анимации */

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}

@keyframes shine {
    0% {
        left: -100px;
    }

    65%,
    100% {
        left: 120%;
    }
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes lightMove {
    from {
        transform: translateX(0);
        opacity: 0.5;
    }

    to {
        transform: translateX(650px);
        opacity: 1;
    }
}

@media (prefers-reduced-motion: reduce) {
    .goal,
    .fill,
    .fill::after,
    .goal::before {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="goal">

    <div class="info">

        <div class="money">
            <span class="current">150 грн</span>
        </div>

        <div class="label">
            🎤 НА МИКРОФОН
        </div>

        <div class="money">
            <span class="target">2700 грн</span>
        </div>

        <div class="percent">
            5.6%
        </div>

    </div>

    <div class="bar">
        <div class="fill"></div>
    </div>

</div>

</body>
</html>

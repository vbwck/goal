
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.goal {
    width: 560px;
    padding: 10px;

    background: rgba(8, 8, 14, 0.88);

    border: 1px solid rgba(168, 85, 247, 0.35);
    border-radius: 13px;

    box-shadow:
        0 0 20px rgba(124, 58, 237, 0.14),
        inset 0 0 18px rgba(168, 85, 247, 0.035);

    animation: blockPulse 4s ease-in-out infinite,
               appear 0.6s ease-out;
}

/* Верх */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 4px 7px;
}

.brand {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.6px;
    color: #fff;
}

.brand span {
    color: #a855f7;
}

.title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #888;
}

/* BAR */

.bar {
    position: relative;

    width: 100%;
    height: 52px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.035)
        );

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 9px;

    overflow: hidden;

    box-shadow:
        inset 0 1px 4px rgba(0,0,0,0.7);
}

/* Заполнение */

.fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5.56%;

    border-radius: 8px;

    background:
        linear-gradient(
            100deg,
            #6d28d9,
            #8b5cf6,
            #c084fc,
            #6366f1,
            #8b5cf6
        );

    background-size: 300% 100%;

    box-shadow:
        0 0 12px rgba(168,85,247,0.75),
        4px 0 18px rgba(124,58,237,0.35);

    animation: gradient 3s linear infinite;
}

/* Блик внутри заполненной области */

.fill::after {
    content: "";

    position: absolute;
    top: 0;
    left: -90px;

    width: 80px;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.75),
        transparent
    );

    animation: shine 2.6s ease-in-out infinite;
}

/* Текст поверх */

.content {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;

    pointer-events: none;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.9),
        0 0 10px rgba(0,0,0,0.8);
}

.amount {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 0.2px;

    color: #fff;
}

.current {
    color: #fff;
}

.slash {
    margin: 0 7px;
    color: rgba(255,255,255,0.5);
}

.target {
    color: rgba(255,255,255,0.82);
}

/* Нижняя строка */

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 6px 4px 0;
}

.support {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #666;
}

.percent {
    font-size: 11px;
    font-weight: 900;
    color: #c084fc;
}

/* Анимации */

@keyframes gradient {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}

@keyframes shine {
    0% {
        left: -90px;
    }

    65%,
    100% {
        left: 120%;
    }
}

/* Лёгкое движение блока */

@keyframes blockPulse {
    0%,
    100% {
        transform: translateY(0);
        box-shadow:
            0 0 20px rgba(124,58,237,0.14),
            inset 0 0 18px rgba(168,85,247,0.035);
    }

    50% {
        transform: translateY(-2px);
        box-shadow:
            0 0 27px rgba(124,58,237,0.22),
            inset 0 0 20px rgba(168,85,247,0.05);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    .goal,
    .fill,
    .fill::after {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="goal">

    <div class="header">

        <div class="brand">
            BULKA<span>GAMING</span>
        </div>

        <div class="title">
            🎤 МАКАФОН
        </div>

    </div>

    <div class="bar">

        <div class="fill"></div>

        <div class="content">

            <div class="amount">
                <span class="current">150 грн</span>
                <span class="slash">/</span>
                <span class="target">2700 грн</span>
            </div>

        </div>

    </div>

    <div class="footer">

        <div class="support">
            ПОДДЕРЖКА СТРИМА
        </div>

        <div class="percent">
            5.6%
        </div>

    </div>

</div>

</body>
</html>

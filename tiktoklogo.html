<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 400px;
    height: 200px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.banner {
    position: relative;
    width: 400px;
    height: 200px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;

    border-radius: 25px;
    overflow: hidden;

    /* Более живой фон */
    background:
        radial-gradient(circle at 8% 15%,
            rgba(31, 110, 170, .35),
            transparent 35%),

        radial-gradient(circle at 95% 90%,
            rgba(190, 78, 28, .28),
            transparent 38%),

        linear-gradient(
            135deg,
            #151a22 0%,
            #0b0e14 48%,
            #171319 100%
        );

    border: 1px solid rgba(255,255,255,.14);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.5),
        0 8px 25px rgba(0,0,0,.35);
}

/* Диагональная текстура */

.banner::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            125deg,
            transparent 0px,
            transparent 18px,
            rgba(255,255,255,.018) 19px,
            rgba(255,255,255,.018) 20px
        );

    animation: backgroundMove 12s linear infinite;
}

/* Световая линия снизу */

.banner::after {
    content: "";
    position: absolute;

    left: 40px;
    right: 40px;
    bottom: 18px;

    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(37, 183, 211, .7),
        rgba(225, 91, 48, .7),
        transparent
    );

    filter: blur(.4px);
}


/* TikTok logo */

.logo {
    position: relative;
    width: 92px;
    height: 105px;

    flex-shrink: 0;

    animation: logoFloat 4s ease-in-out infinite;
}

/* cyan слой */

.note-cyan {
    position: absolute;
    left: 4px;
    top: -2px;

    font-size: 105px;
    font-weight: 900;
    line-height: 1;

    color: #25d5df;
}

/* красный слой */

.note-red {
    position: absolute;
    left: -4px;
    top: 3px;

    font-size: 105px;
    font-weight: 900;
    line-height: 1;

    color: #e84962;
}

/* основной белый */

.note-main {
    position: absolute;
    left: 0;
    top: 0;

    font-size: 105px;
    font-weight: 900;
    line-height: 1;

    color: #f5f5f5;

    text-shadow:
        0 4px 10px rgba(0,0,0,.5);
}


/* Текст */

.text {
    display: flex;
    flex-direction: column;
    gap: 5px;

    z-index: 2;
}

.small {
    font-size: 13px;
    font-weight: 600;

    color: rgba(255,255,255,.55);

    letter-spacing: 2px;
    text-transform: uppercase;
}

.name {
    font-size: 31px;
    font-weight: 900;

    color: #f5f5f5;

    letter-spacing: -1px;

    text-shadow:
        0 3px 8px rgba(0,0,0,.65);

    animation: nameGlow 5s ease-in-out infinite;
}


/* маленькая точка */

.dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 6px;

    border-radius: 50%;

    background: #e84b61;

    box-shadow: 0 0 6px rgba(232,75,97,.5);
}


/* Анимации */

@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-5px) rotate(-1deg);
    }
}

@keyframes nameGlow {
    0%,100% {
        text-shadow:
            0 3px 8px rgba(0,0,0,.65);
    }

    50% {
        text-shadow:
            0 3px 8px rgba(0,0,0,.65),
            0 0 12px rgba(37,183,211,.20);
    }
}

@keyframes backgroundMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 120px 0;
    }
}

</style>
</head>

<body>

<div class="banner">

    <div class="logo">
        <div class="note-red">♪</div>
        <div class="note-cyan">♪</div>
        <div class="note-main">♪</div>
    </div>

    <div class="text">

        <div class="small">
            <span class="dot"></span>TIKTOK
        </div>

        <div class="name">
            @bulkagaming
        </div>

    </div>

</div>

</body>
</html>

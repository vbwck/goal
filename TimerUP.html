<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bulka — таймер стрима с управлением</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:12px}.widget{width:340px;background:linear-gradient(125deg,rgba(20,15,20,.94),rgba(32,15,17,.9));border:1px solid #a74736;border-radius:13px;box-shadow:0 0 14px #9e312a66,inset 0 1px #ffffff22;padding:13px 18px;text-align:center}.heading{font-size:13px;font-weight:900;letter-spacing:1.6px;color:#ffca73}.clock{font-size:49px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.25;text-shadow:0 2px 12px #e64a2c55}.foot{font-size:11px;color:#d9bdb4;letter-spacing:.5px}.foot b{color:#ffd079}.controls{width:340px;margin-top:14px;background:#21191e;border:1px solid #6c4242;border-radius:12px;padding:14px;display:block}.controls h3{margin:0 0 10px;font-size:15px}.controls button,.controls input{border-radius:7px;padding:9px;border:1px solid #7a5550;background:#38272b;color:white;font-size:14px}.controls button{cursor:pointer}.controls button:hover{background:#714034}.controls input{width:65px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.hint{font-size:11px;color:#b8a7a7;line-height:1.5}</style></head><body><div class="widget"><div class="heading">ДО КОНЦА СТРИМА</div><div class="clock" id="clock">05:13:12</div><div class="foot">SEXYBIT44 <b>• +1 ЧАС ЗА 200 ГРН</b></div></div><section class="controls"><h3>Управление таймером</h3><div>Установить: <input id="hours" type="number" min="0" max="999" value="6"> ч <input id="minutes" type="number" min="0" max="59" value="53"> м <input id="seconds" type="number" min="0" max="59" value="12"> с</div><div class="buttons"><button id="set">Установить</button><button id="toggle">Пауза</button><button id="plus">+1 час</button><button id="minus">−1 мин</button><button id="reset">Сброс</button></div><div class="hint">В OBS скрой панель управления обрезкой источника снизу (Alt + перетаскивание). Через «Взаимодействовать» кнопки остаются доступными.</div></div></section><script>
const initial=5*3600+53*60+12;const key='sexybit44_timer_v1';let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!state||typeof state.remaining!=='number')state={remaining:initial,running:true,updated:Date.now()};function current(){return Math.max(0,Math.round(state.remaining-(state.running?(Date.now()-state.updated)/1000:0)))}function save(seconds,running=state.running){state={remaining:Math.max(0,Math.round(seconds)),running,updated:Date.now()};try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}render()}function fmt(n){const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}function render(){const n=current();document.getElementById('clock').textContent=fmt(n);document.getElementById('toggle').textContent=state.running?'Пауза':'Продолжить';if(n===0&&state.running)save(0,false)}document.getElementById('set').onclick=()=>save((+hours.value||0)*3600+(+minutes.value||0)*60+(+seconds.value||0),true);document.getElementById('toggle').onclick=()=>save(current(),!state.running);document.getElementById('plus').onclick=()=>save(current()+3600);document.getElementById('minus').onclick=()=>save(current()-60);document.getElementById('reset').onclick=()=>save(initial,false);setInterval(()=>{try{const latest=JSON.parse(localStorage.getItem(key)||'null');if(latest&&latest.updated!==state.updated)state=latest}catch(e){}render()},250);render();
</script></body></html>

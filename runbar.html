<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.ticker {
    width: 100%;
    height: 55px;
    display: flex;
    align-items: center;
    overflow: hidden;

    background: rgba(10, 10, 15, 0.88);
    border-top: 2px solid #ff2d95;
    border-bottom: 2px solid #7b2cff;

    box-shadow:
        0 0 10px rgba(255, 45, 149, 0.5),
        0 0 20px rgba(123, 44, 255, 0.25);
}

.ticker-track {
    display: flex;
    width: max-content;
    animation: scroll 20s linear infinite;
}

.ticker-content {
    white-space: nowrap;
    font-size: 24px;
    font-weight: 800;
    color: white;
    padding-right: 120px;

    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #ff2d95;
}

.tiktok {
    color: #5ee7ff;

    text-shadow:
        0 0 5px #5ee7ff,
        0 0 12px #00d9ff;
}

.separator {
    color: #ffcf40;
    padding: 0 35px;

    text-shadow:
        0 0 5px #ffcf40,
        0 0 10px #ff9d00;
}

@keyframes scroll {
    from {
        transform: translateX(100vw);
    }

    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="ticker">
    <div class="ticker-track">
        <div class="ticker-content">

            Поддержи лайком или подпиской

            <span class="separator">✦</span>

            🎮 Мой TikTok аккаунт:
            <span class="tiktok">tiktok.com/@bulkagaming</span>

            <span class="separator">✦</span>

            Заходи

            <span class="separator">✦</span>

            Спасибо за просмотр и подписки <3
            
            
            
            

        </div>
    </div>
</div>

</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
    width: fit-content;
    padding: 6px 12px;

    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;

    animation: textGlow 6s ease-in-out infinite;
}

.icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    font-size: 20px;

    background: linear-gradient(
        135deg,
        #7d35ff,
        #c06cff
    );

    animation: iconColor 6s ease-in-out infinite;

    box-shadow:
        0 0 15px rgba(150,70,255,.6);
}

/* ТЕКСТ — переливание свечения */
@keyframes textGlow {

    0% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }

    25% {
        text-shadow:
            0 0 7px rgba(255,80,190,.8),
            0 0 16px rgba(255,60,180,.5);
    }

    50% {
        text-shadow:
            0 0 8px rgba(255,210,60,.95),
            0 0 20px rgba(255,190,30,.65);
    }

    75% {
        text-shadow:
            0 0 8px rgba(210,255,70,.9),
            0 0 18px rgba(190,255,40,.55);
    }

    100% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }
}

/* ИКОНКА — меняет цвет */
@keyframes iconColor {

    0% {
        background: linear-gradient(135deg,#6f2cff,#b75cff);
        box-shadow: 0 0 15px rgba(140,60,255,.6);
    }

    25% {
        background: linear-gradient(135deg,#b52cff,#ff62c4);
        box-shadow: 0 0 20px rgba(255,70,190,.65);
    }

    50% {
        background: linear-gradient(135deg,#ff9d00,#ffe44d);
        box-shadow: 0 0 24px rgba(255,190,30,.8);
    }

    75% {
        background: linear-gradient(135deg,#b9ff28,#f2ff72);
        box-shadow: 0 0 24px rgba(200,255,50,.75);
    }

    100% {
        background: linear-gradient(135deg,#6f2cff,#b75cff);
        box-shadow: 0 0 15px rgba(140,60,255,.6);
    }
}
</style>
</head>

<body>

<div class="now-playing">
    <div class="icon">🎵</div>
    <div>NOW PLAYING</div>
</div>

</body>
</html>

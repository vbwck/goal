
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.player {
    position: relative;
    width: 350px;
    height: 55px;
    background: transparent;
}

/* НАДПИСЬ */

.now-playing {
    position: absolute;
    top: 8px;
    left: 0;

    display: flex;
    align-items: center;
    gap: 8px;

    color: white;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1.5px;
    white-space: nowrap;

    text-shadow:
        0 0 6px rgba(170,80,255,.8),
        0 0 14px rgba(170,80,255,.5);

    animation: textGlow 6s ease-in-out infinite;
}

/* ИКОНКА */

.icon {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;
    font-size: 19px;

    background: linear-gradient(135deg,#6f2cff,#b75cff);

    box-shadow: 0 0 14px rgba(140,60,255,.55);
}

/* ПЛАВНАЯ АНИМАЦИЯ ЦВЕТА */

@keyframes textGlow {
    0%, 100% {
        text-shadow:
            0 0 6px rgba(170,80,255,.8),
            0 0 14px rgba(170,80,255,.5);
    }

    33% {
        text-shadow:
            0 0 8px rgba(255,90,190,.9),
            0 0 18px rgba(255,60,180,.6);
    }

    66% {
        text-shadow:
            0 0 8px rgba(255,210,60,.9),
            0 0 18px rgba(255,190,30,.6);
    }
}
</style>
</head>

<body>
    <div class="player">
        <div class="now-playing">
            <div class="icon">🎵</div>
            <div>NOW PLAYING</div>
        </div>
    </div>
</body>
</html>

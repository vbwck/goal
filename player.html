
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.player {
    position: relative;

    width: 520px;
    height: 125px;

    padding: 8px 10px;

    box-sizing: border-box;

    border: 1px solid rgba(180,100,255,.55);
    border-radius: 18px;

    background: rgba(5, 3, 12, 0.15);

    box-shadow:
        0 0 8px rgba(150,60,255,.45),
        0 0 22px rgba(150,60,255,.25),
        inset 0 0 15px rgba(150,60,255,.08);

    animation: neon 8s ease-in-out infinite;
}

/* Заголовок */

.now-playing {
    position: absolute;

    top: 8px;
    left: 0;

    width: 100%;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    color: white;

    font-size: 20px;
    font-weight: 800;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px rgba(170,80,255,.8),
        0 0 16px rgba(170,80,255,.4);

    animation: textGlow 6s ease-in-out infinite;
}

/* Иконка */

.icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    font-size: 20px;

    background: linear-gradient(
        135deg,
        #6f2cff,
        #b75cff
    );

    box-shadow:
        0 0 15px rgba(140,60,255,.55);

    animation: iconColor 14s ease-in-out infinite;
}

/* Неоновая рамка */

@keyframes neon {

    0%, 100% {
        border-color: rgba(150,70,255,.4);

        box-shadow:
            0 0 8px rgba(150,60,255,.35),
            0 0 20px rgba(150,60,255,.18),
            inset 0 0 12px rgba(150,60,255,.05);
    }

    50% {
        border-color: rgba(255,210,60,.6);

        box-shadow:
            0 0 10px rgba(255,180,40,.55),
            0 0 28px rgba(255,190,40,.3),
            inset 0 0 18px rgba(255,190,40,.08);
    }
}

/* Свечение текста */

@keyframes textGlow {

    0% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }

    25% {
        text-shadow:
            0 0 7px rgba(255,80,190,.8),
            0 0 16px rgba(255,60,180,.5);
    }

    50% {
        text-shadow:
            0 0 8px rgba(255,210,60,.95),
            0 0 20px rgba(255,190,30,.65);
    }

    75% {
        text-shadow:
            0 0 8px rgba(210,255,70,.9),
            0 0 18px rgba(190,255,40,.55);
    }

    100% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }
}

/* Плавная иконка */

@keyframes iconColor {

    0% {
        background: linear-gradient(135deg,#6f2cff,#b75cff);
        box-shadow: 0 0 15px rgba(140,60,255,.55);
    }

    20% {
        background: linear-gradient(135deg,#8f38ee,#d65cdb);
        box-shadow: 0 0 17px rgba(180,70,230,.58);
    }

    40% {
        background: linear-gradient(135deg,#d85ab7,#f58b72);
        box-shadow: 0 0 19px rgba(240,110,150,.62);
    }

    60% {
        background: linear-gradient(135deg,#f3a52d,#ffe05a);
        box-shadow: 0 0 21px rgba(255,190,40,.68);
    }

    80% {
        background: linear-gradient(135deg,#c8f34a,#efff80);
        box-shadow: 0 0 19px rgba(200,255,60,.62);
    }

    100% {
        background: linear-gradient(135deg,#6f2cff,#b75cff);
        box-shadow: 0 0 15px rgba(140,60,255,.55);
    }
}

</style>
</head>

<body>

<div class="player">

    <div class="now-playing">
        <div class="icon">🎵</div>
        <div>NOW PLAYING</div>
    </div>

</div>

</body>
</html>

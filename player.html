<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.now-playing {
    display: flex;
    align-items: center;
    gap: 12px;

    width: fit-content;

    padding: 6px 12px;

    color: white;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;

    text-shadow: 0 0 12px rgba(180,100,255,.8);
}

.icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #7d35ff,
        #c06cff
    );

    font-size: 20px;

    box-shadow:
        0 0 18px rgba(150,70,255,.55);
}
</style>
</head>

<body>

<div class="now-playing">
    <div class="icon">🎵</div>
    <div>NOW PLAYING</div>
</div>

</body>
</html>

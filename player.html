
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* ОСНОВНОЙ ПРОЗРАЧНЫЙ БЛОК */
.now-playing-box {
    width: 520px;
    height: 125px;

    position: relative;

    padding: 8px 10px;

    border-radius: 18px;

    border: 1px solid rgba(180,100,255,.45);

    box-shadow:
        0 0 8px rgba(150,60,255,.45),
        0 0 20px rgba(150,60,255,.25),
        inset 0 0 15px rgba(150,60,255,.08);

    animation: neonPulse 7s ease-in-out infinite;

    background: transparent;
}


/* ЗАГОЛОВОК */
.now-playing {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    height: 40px;

    color: #fff;

    font-size: 20px;
    font-weight: 800;

    letter-spacing: 2px;

    animation: textGlow 6s ease-in-out infinite;
}


/* ИКОНКА */
.icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    font-size: 20px;

    background: linear-gradient(
        135deg,
        #7d35ff,
        #c06cff
    );

    animation: iconColor 14s ease-in-out infinite;

    box-shadow:
        0 0 15px rgba(150,70,255,.55);
}


/* =========================
   СВЕЧЕНИЕ ТЕКСТА
   ========================= */

@keyframes textGlow {

    0% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }

    25% {
        text-shadow:
            0 0 7px rgba(255,80,190,.8),
            0 0 16px rgba(255,60,180,.5);
    }

    50% {
        text-shadow:
            0 0 8px rgba(255,210,60,.95),
            0 0 20px rgba(255,190,30,.65);
    }

    75% {
        text-shadow:
            0 0 8px rgba(210,255,70,.9),
            0 0 18px rgba(190,255,40,.55);
    }

    100% {
        text-shadow:
            0 0 6px rgba(170,80,255,.7),
            0 0 12px rgba(120,50,255,.4);
    }
}

   ПЛАВНАЯ ИКОНКА
